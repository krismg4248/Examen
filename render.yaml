# Monorepo TORQUE — Render Blueprint

services:
  - type: web
    name: torque
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_OPTIONS
        value: --use-system-ca
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
